<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>To-Do List</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='output.css') }}"
  >
</head>


<body class="relative min-h-screen overflow-hidden bg-slate-950">


  <!-- =====================================
       BACKGROUND IMAGE
  ====================================== -->

  <div
    class="absolute inset-0 bg-[url('/static/images/background.png')]
           bg-center bg-cover bg-no-repeat
           opacity-20">
  </div>


  <!-- =====================================
       DARK CINEMATIC OVERLAY
  ====================================== -->

  <div
    class="absolute inset-0
           bg-gradient-to-b
           from-slate-950/70
           via-blue-950/60
           to-slate-950/90">
  </div>


  <!-- =====================================
       RAIN CONTAINER
  ====================================== -->

  <div
    id="rain"
    class="absolute inset-0 overflow-hidden pointer-events-none">
  </div>


  <!-- =====================================
       LIGHTNING
  ====================================== -->

  <div class="lightning z-10"></div>


  <!-- =====================================
       MAIN CONTENT
  ====================================== -->

  <main
    class="relative z-20 min-h-screen
           flex flex-col
           items-center
           justify-center
           px-4">


    <!-- ===================================
         NAVIGATION
    ==================================== -->

    <nav class="mb-6">

      <ul
        class="flex
               space-x-6
               text-white
               font-semibold
               drop-shadow-lg">

        <li>
          <a
            href="{{ url_for('data') }}"
            class="hover:text-blue-300 transition duration-300">
            Home
          </a>
        </li>

        <li>
          <a
            href="{{ url_for('data') }}"
            class="hover:text-blue-300 transition duration-300">
            About
          </a>
        </li>

        <li>
          <a
            href="{{ url_for('data') }}"
            class="hover:text-blue-300 transition duration-300">
            Instagram
          </a>
        </li>

      </ul>

    </nav>


    <!-- ===================================
         TODO CARD
    ==================================== -->

    <div
      class="relative
             w-full
             max-w-md
             p-6

             bg-slate-900/70
             backdrop-blur-xl

             border
             border-white/20

             rounded-2xl

             shadow-2xl
             shadow-black/50

             overflow-hidden">


      <!-- Glass shimmer -->

      <div
        class="glass-shimmer
               absolute
               inset-0
               bg-gradient-to-br
               from-white/20
               via-transparent
               to-blue-500/10
               pointer-events-none">
      </div>


      <!-- Card content -->

      <div class="relative z-10">


        <!-- TITLE -->

        <h1
          class="text-3xl
                 font-bold
                 mb-5
                 text-white
                 drop-shadow-lg">

          To-Do List

        </h1>


        <!-- =================================
             ADD TASK FORM
        ================================== -->

        <form
          method="POST"
          action="{{ url_for('add_task') }}"
          class="mb-5">


          <textarea
            name="task"
            placeholder="Enter a new task"
            rows="3"

            class="border
                   border-white/20

                   bg-white/10

                   text-white
                   placeholder-gray-300

                   p-3
                   rounded-xl

                   shadow-inner

                   w-full
                   resize-none

                   backdrop-blur-md

                   focus:outline-none
                   focus:ring-2
                   focus:ring-blue-400

                   transition">
          </textarea>


          <button
            type="submit"

            class="mt-3

                   bg-blue-600
                   hover:bg-blue-500
                   active:bg-blue-700

                   text-white
                   font-semibold

                   px-5
                   py-2.5

                   rounded-xl

                   shadow-lg
                   shadow-blue-900/40

                   transition
                   duration-300">

            Add Task

          </button>


        </form>


        <!-- =================================
             TASK LIST
        ================================== -->

        <ul>

          {% for task in tasks %}

          <li
            class="flex
                   justify-between
                   items-center

                   bg-gradient-to-r
                   from-blue-600/80
                   to-blue-800/80

                   backdrop-blur-md

                   p-3
                   mb-2

                   rounded-xl

                   border
                   border-white/10

                   shadow-lg">


            {% if task.completed %}

            <span
              class="line-through
                     text-gray-300">

              {{ task.name }}

            </span>

            {% else %}

            <span class="text-white">

              {{ task.name }}

            </span>

            {% endif %}


            <!-- ACTION BUTTONS -->

            <div class="space-x-3">

              <a
                href="{{ url_for('complete_task', id=task.id) }}"
                class="text-green-300
                       hover:text-green-100
                       font-bold
                       transition">

                ✔

              </a>


              <a
                href="{{ url_for('delete_task', id=task.id) }}"
                class="text-red-300
                       hover:text-red-100
                       font-bold
                       transition">

                ✖

              </a>

            </div>


          </li>

          {% endfor %}

        </ul>


      </div>

    </div>

  </main>

  <script>

    const rainContainer = document.getElementById("rain");

    // Number of rain drops
    const DROP_COUNT = 180;


    for (let i = 0; i < DROP_COUNT; i++) {

      const drop = document.createElement("span");

      drop.classList.add("rain-drop");


      // Random horizontal position

      drop.style.left = Math.random() * 110 + "%";


      // Random height

      const height =
        Math.random() * 80 + 40;

      drop.style.height =
        `${height}px`;


      // Random width

      const width =
        Math.random() * 2 + 0.5;

      drop.style.width =
        `${width}px`;


      // Random speed

      const duration =
        Math.random() * 0.8 + 0.4;

      drop.style.animationDuration =
        `${duration}s`;


      // Negative delay means rain is already falling when page loads
     const delay =
        Math.random() * -2;

      drop.style.animationDelay =
        `${delay}s`;


      // Random brightness

      const opacity =
        Math.random() * 0.5 + 0.25;

      drop.style.opacity =
        opacity;


      rainContainer.appendChild(drop);

    }

  </script>


</body>

</html>
